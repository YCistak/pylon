# Pylon configuration. Every field is optional — omitted values fall back to
# built-in defaults. ${ENV_VAR} references are expanded from the environment,
# so secrets (API keys) stay out of this file.

voice:
  stt_bin: whisper-cli              # whisper.cpp CLI binary (in PATH or absolute)
  stt_model: ""                     # ggml model path, e.g. ~/models/ggml-large-v3.bin
  language: auto                    # auto-detect, or ISO code: tr, en, de, ...
  record_seconds: 5                 # push-to-talk capture window
  # tts_cmd: synthesis command — text on stdin, write a WAV to {file}. Engine-
  # agnostic. Examples:
  #   piper:  ["piper", "-m", "/path/voice.onnx", "-f", "{file}"]
  #   XTTS server (natural, GPU): a curl client posting text to the local server:
  #     ["curl", "-sf", "--data-binary", "@-", "-o", "{file}", "http://127.0.0.1:5067/tts"]
  tts_cmd: []                       # empty → spoken replies disabled (text still printed)
  # record_cmd / play_cmd default per-OS (Linux: pw-record/pw-play). Override if
  # needed; {file} and {seconds} are substituted. Examples:
  #   record_cmd: ["arecord", "-q", "-f", "S16_LE", "-r", "16000", "-c", "1", "-d", "{seconds}", "{file}"]
  #   play_cmd:   ["paplay", "{file}"]
  hotkey: "super+p"                 # informational — bind `pylon listen` in your DE/OS

intent:
  router_threshold: 0.8                # local match confidence to skip the API
  # LLM fallback chain. Models are tried top-to-bottom; when one hits its quota
  # (HTTP 429) or errors, the next is used. Each provider has its own quota
  # bucket, so mixing providers spreads load. List one model or many.
  models:
    - provider: gemini
      model: gemini-flash-lite-latest    # cheap/fast — first choice
      api_key_env: GEMINI_API_KEY
    - provider: gemini
      model: gemini-flash-latest         # used when flash-lite is exhausted
      api_key_env: GEMINI_API_KEY
    # - provider: openai
    #   model: gpt-4o-mini
    #   api_key_env: OPENAI_API_KEY
    # - provider: anthropic
    #   model: claude-haiku-4-5
    #   api_key_env: ANTHROPIC_API_KEY

persona:
  enabled: true
  decay_half_life_days: 14             # how fast old style fades
  adopt_threshold: 0.3                 # min recency-weighted frequency to adopt a trait
  style_card_refresh_every: 20         # rebuild style card every N messages

services:
  # Google Calendar (Phase 2). End users just run `pylon auth google` and sign in
  # — no Google Cloud setup. The project's OAuth client is baked into the build
  # (see Makefile GOOGLE_CLIENT_ID). Self-hosters can instead set client_id/
  # client_secret here (or point `credentials` at an OAuth client JSON). The
  # user's token is written to the encrypted vault (internal/secrets), not to a file.
  google:
    # client_id: ...
    # client_secret: ...
    # credentials: ~/.config/pylon/google-credentials.json
    calendar_id: primary
  # GitHub (Phase 2.2). Personal Access Token — classic needs `repo`+`read:org`,
  # or a fine-grained token with PR/issue read. ${ENV} is expanded, so keep the
  # token in the environment rather than committing it.
  github:
    # Secrets are stored encrypted (AES-256-GCM), not here. Save once with
    #   pylon secret set github
    # then reference it as secret:<name>. (Plain values and ${ENV} still work.)
    token: secret:github
    poll_interval: 15m            # background PR poll; empty disables it
    commit_reminder: "22:00"      # daily "you haven't committed today" nudge
    repos:                        # local repos checked for today's commit
      - /path/to/your/repo
  # FreshRSS (Phase 2.3) via the Fever API. Enable the API in FreshRSS
  # (Settings → Profile → API) and either set api_key directly or give
  # username + api_password (key = md5("username:api_password")). ${ENV} expands.
  freshrss:
    url: ""                       # e.g. https://rss.example.com — empty disables it
    username: ""
    api_password: secret:freshrss   # save with: pylon secret set freshrss
  # Spotify (Phase 2.4) playback control via the Web API. End users just run
  # `pylon auth spotify` and connect — no Spotify Dashboard setup. The project's
  # OAuth client is baked into the build (see Makefile SPOTIFY_CLIENT_ID) using
  # Authorization Code + PKCE, so there is no client secret. Self-hosters can
  # instead set client_id here (their app's Redirect URI must exactly match
  # http://127.0.0.1:<redirect_port>/callback). The user's token is written to
  # the encrypted vault (internal/secrets), not to a file. Playback control
  # needs Spotify Premium and an active device.
  spotify:
    # client_id: ...
    redirect_port: 8888

briefing:
  time: "08:00"
  timezone: "Europe/Istanbul"

work:
  daily_goal_hours: 4
  tracked_apps:
    - code
    - cs2
    - steam

watch_processes:
  - name: code
    tasks_on_exit: true
  - name: cs2
    tasks_on_exit: true

# Runtime paths (defaults shown). DB defaults to ~/.config/pylon/pylon.db.
paths:
  socket: /tmp/pylon.sock
  pid: /tmp/pylon.pid
  # db: /home/you/.config/pylon/pylon.db
